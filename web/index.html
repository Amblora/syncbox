<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncBox - 同步管理面板</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#3b82f6;--accent2:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* 登录页面样式 */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px;width:400px;max-width:90vw}
.login-box h1{text-align:center;font-size:28px;margin-bottom:8px;color:var(--accent)}
.login-box .subtitle{text-align:center;color:var(--text2);margin-bottom:32px;font-size:14px}
.login-box .form-group{margin-bottom:20px}
.login-box label{display:block;margin-bottom:8px;color:var(--text2);font-size:14px}
.login-box input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600;transition:opacity .2s}
.login-box button:hover{opacity:.9}
.login-error{color:var(--red);text-align:center;margin-top:12px;font-size:14px;min-height:20px}

/* 主布局 */
#mainApp{display:none;height:100vh;overflow:hidden}
.app-layout{display:flex;height:100vh}

/* 侧边栏 */
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);text-align:center}
.sidebar-header h2{font-size:20px;color:var(--accent);font-weight:700}
.sidebar-header .version{font-size:11px;color:var(--text2);margin-top:4px}
.sidebar-group{padding:12px 0}
.sidebar-group-title{padding:4px 16px 8px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sidebar-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;transition:background .15s;font-size:14px;color:var(--text);gap:10px;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(59,130,246,.1)}
.sidebar-item.active{background:rgba(59,130,246,.15);border-left-color:var(--accent);color:var(--accent)}
.sidebar-item.sub-item{padding-left:36px;font-size:13px}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border)}
.sidebar-footer button{width:100%;padding:10px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}
.sidebar-footer button:hover{border-color:var(--red);color:var(--red)}

/* 主内容区 */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.content-header h1{font-size:18px;font-weight:600}
.content-body{flex:1;overflow-y:auto;padding:24px}

/* 统计卡片网格 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s,border-color .2s}
.stat-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat-card .label{font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .sub{font-size:12px;color:var(--text2);margin-top:4px}

/* 按钮通用 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{opacity:.9;color:#fff}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-success:hover{opacity:.9;color:#fff}
.btn-warning{background:var(--yellow);border-color:var(--yellow);color:#000}
.btn-warning:hover{opacity:.9;color:#000}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;padding:12px 16px;background:rgba(15,23,42,.5);color:var(--text2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:rgba(59,130,246,.05)}
tbody tr.selected{background:rgba(59,130,246,.1)}
input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}

/* 状态标签 */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-yellow{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent)}

/* 模态框 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:360px;max-width:90vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-box.wide{min-width:700px;max-width:95vw;width:900px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;line-height:1}
.modal-close:hover{color:var(--text);background:rgba(255,255,255,.05)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* 表单 */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:var(--text2);font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:100px}
.form-section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.form-section-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* Toast通知 */
.toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:8px;font-size:14px;pointer-events:auto;animation:toastIn .3s ease;max-width:400px;box-shadow:0 4px 12px rgba(0,0,0,.3);word-wrap:break-word}
.toast.info{background:var(--accent);color:#fff}
.toast.success{background:var(--green);color:#fff}
.toast.error{background:var(--red);color:#fff}
.toast.warning{background:var(--yellow);color:#000}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* 加载遮罩 */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.7);z-index:9500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:14px}

/* 文件管理器布局 */
.file-manager{display:flex;gap:0;height:calc(100vh - 130px);overflow:hidden}
.file-tree-panel{width:240px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;background:rgba(15,23,42,.3);padding:8px}
.file-tree-panel .tree-item{padding:6px 10px;cursor:pointer;border-radius:6px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-tree-panel .tree-item:hover{background:rgba(59,130,246,.1)}
.file-tree-panel .tree-item.active{background:rgba(59,130,246,.15);color:var(--accent)}
.file-tree-panel .tree-children{margin-left:16px}
.file-list-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.file-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px;flex:1;min-width:0;overflow-x:auto}
.breadcrumb span{cursor:pointer;color:var(--accent);white-space:nowrap;padding:2px 6px;border-radius:4px}
.breadcrumb span:hover{background:rgba(59,130,246,.1)}
.breadcrumb span.current{color:var(--text);cursor:default}
.breadcrumb span.current:hover{background:transparent}
.breadcrumb .sep{color:var(--text2);cursor:default;padding:0}
.file-list-body{flex:1;overflow-y:auto;padding:0}
.file-row{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;gap:12px}
.file-row:hover,.move-dir-item:hover{background:rgba(59,130,246,.1)}
.file-row.selected{background:rgba(59,130,246,.1)}
.file-row .file-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.file-row .file-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .file-size{width:80px;text-align:right;font-size:12px;color:var(--text2);flex-shrink:0}
.file-row .file-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.file-row:hover .file-actions{opacity:1}
.file-row .file-check{width:20px;flex-shrink:0}

/* 上传进度 */
.upload-progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.upload-progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* 图表容器 */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.chart-card h3{font-size:14px;margin-bottom:12px;color:var(--text2)}
.chart-card canvas{width:100%;height:200px;display:block}

/* 回收站 */
.trash-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state .text{font-size:16px}

/* 设置表单 */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(450px,1fr));gap:20px}

/* 代码/Token显示 */
.token-display{font-family:"Cascadia Code","Fira Code","Consolas",monospace;background:var(--bg);padding:4px 8px;border-radius:4px;font-size:13px;border:1px solid var(--border);cursor:pointer;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.token-display:hover{border-color:var(--accent)}

/* 文件查看器 */
.file-viewer{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;line-height:1.6}
.file-viewer img{max-width:100%;border-radius:8px}

/* 日志行数 */
.log-row-num{color:var(--text2);font-size:11px;width:30px;text-align:right;padding-right:8px}

/* 滚动条美化 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}

/* 清理页面 */
.cleanup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:20px}
.cleanup-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.cleanup-card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cleanup-card .item-list{margin:12px 0}
.cleanup-card .item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(51,65,85,.5);font-size:13px}
.cleanup-card .item:last-child{border-bottom:none}

/* 响应式 */
@media(max-width:768px){
.sidebar{width:60px}
.sidebar-group-title,.sidebar-footer button span,.sidebar-header .version{display:none}
.sidebar-item{padding:12px;justify-content:center}
.sidebar-item span{display:none}
.content-body{padding:16px}
.stats-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.file-tree-panel{display:none}
.chart-grid{grid-template-columns:1fr}
.settings-grid{grid-template-columns:1fr}
}

/* 空状态提示 */
.no-data{color:var(--text2);text-align:center;padding:40px;font-size:14px}

/* 资源监控 - 公有云控制台风格 */
.monitor-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.monitor-time-range{display:flex;gap:6px}
.monitor-time-range .btn{padding:6px 14px;font-size:12px}
.monitor-time-range .btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 指标概览卡片 */
.monitor-metrics-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.metric-card .mc-icon{position:absolute;top:12px;right:14px;font-size:22px;opacity:.5}
.metric-card .mc-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.metric-card .mc-value{font-size:24px;font-weight:700;line-height:1.2}
.metric-card .mc-unit{font-size:13px;font-weight:400;color:var(--text2);margin-left:2px}
.metric-card .mc-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:10px;overflow:hidden}
.metric-card .mc-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.metric-card .mc-sub{font-size:11px;color:var(--text2);margin-top:6px}

/* 状态色 */
.mc-green .mc-value{color:var(--green)}
.mc-green .mc-bar-fill{background:var(--green)}
.mc-yellow .mc-value{color:var(--yellow)}
.mc-yellow .mc-bar-fill{background:var(--yellow)}
.mc-red .mc-value{color:var(--red)}
.mc-red .mc-bar-fill{background:var(--red)}
.mc-blue .mc-value{color:var(--accent)}
.mc-blue .mc-bar-fill{background:var(--accent)}
.mc-purple .mc-value{color:var(--accent2)}
.mc-purple .mc-bar-fill{background:var(--accent2)}

/* 图表区域 */
.monitor-charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;margin-bottom:24px}
.monitor-chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.monitor-chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monitor-chart-header h4{font-size:13px;font-weight:600;color:var(--text2)}
.monitor-chart-header .mch-current{font-size:18px;font-weight:700}
.monitor-chart-card canvas{width:100%;height:180px;display:block}

/* 详细信息面板 */
.monitor-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.monitor-detail-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.monitor-detail-card h4{font-size:14px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.monitor-detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.monitor-detail-row .mdr-label{color:var(--text2)}
.monitor-detail-row .mdr-value{font-weight:500}

/* 操作按钮组 */
.monitor-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}

/* 冲突列表 */
.conflict-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.conflict-item .conflict-path{flex:1;font-size:14px}
.conflict-item .conflict-actions{display:flex;gap:8px}
</style>
</head>
<body>

<!-- Toast容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<div class="loading-text">处理中...</div>
</div>

<!-- 模态框容器 -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal-box" id="modalBox">
<div class="modal-header">
<h3 id="modalTitle">提示</h3>
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-footer" id="modalFooter"></div>
</div>
</div>

<!-- 登录页面 -->
<div id="loginPage">
<div class="login-box">
<h1>SyncBox</h1>
<div class="subtitle">同步管理系统</div>
<div class="form-group">
<label for="loginUser">用户名</label>
<input type="text" id="loginUser" placeholder="请输入用户名" value="admin">
</div>
<div class="form-group">
<label for="loginPass">密码</label>
<input type="password" id="loginPass" placeholder="请输入密码" value="admin123">
</div>
<button onclick="doLogin()">登 录</button>
<div class="login-error" id="loginError"></div>
</div>
</div>

<!-- 主应用 -->
<div id="mainApp">
<div class="app-layout">

<!-- 侧边栏 -->
<div class="sidebar">
<div class="sidebar-header">
<h2>SyncBox</h2>
<div class="version">管理面板 v1.0</div>
</div>

<div class="sidebar-group">
<div class="sidebar-group-title">主要功能</div>
<div class="sidebar-item active" data-page="overview" onclick="switchPage('overview',this)">
<span>📊</span><span>总览</span>
</div>
<div class="sidebar-item" data-page="files" onclick="switchPage('files',this)">
<span>📁</span><span>文件管理</span>
</div>
</div>

<div class="sidebar-group">
<div class="sidebar-group-title">设备与接入</div>
<div class="sidebar-item" data-page="devices" onclick="switchPage('devices',this)">
<span>🖥️</span><span>设备管理</span>
</div>
<div class="sidebar-item" data-page="tokens" onclick="switchPage('tokens',this)">
<span>🔑</span><span>Token管理</span>
</div>
</div>

<div class="sidebar-group">
<div class="sidebar-group-title">冲突与监控</div>
<div class="sidebar-item" data-page="conflicts" onclick="switchPage('conflicts',this)">
<span>⚠️</span><span>冲突中心</span>
</div>
<div class="sidebar-item" data-page="monitor" onclick="switchPage('monitor',this)">
<span>📈</span><span>资源监控</span>
</div>
<div class="sidebar-item" data-page="cleanup" onclick="switchPage('cleanup',this)">
<span>🧹</span><span>磁盘清理</span>
</div>
<div class="sidebar-item" data-page="trash" onclick="switchPage('trash',this)">
<span>🗑️</span><span>回收站</span>
</div>
<div class="sidebar-item" data-page="settings" onclick="switchPage('settings',this)">
<span>⚙️</span><span>设置</span>
</div>
</div>

<div class="sidebar-footer">
<button onclick="doLogout()"><span>退出登录</span></button>
</div>
</div>

<!-- 主内容区 -->
<div class="main-content">
<div class="content-header">
<h1 id="pageTitle">总览</h1>
<div id="headerActions"></div>
</div>
<div class="content-body" id="contentBody">
<!-- 动态内容 -->
</div>
</div>

</div>
</div>

<script>
/* ========================================================
   全局变量和配置
   ======================================================== */
var API_BASE = "/api/admin";

/* 获取存储的Token */
function getToken() {

/* HTML转义防止XSS */
function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/[""]/g, '&quot;');
}

/* 格式化文件大小 */
function formatSize(bytes) {
    if (!bytes || bytes === 0) return "0 B";
    var units = ["B", "KB", "MB", "GB", "TB"];
    var i = 0;
    while (bytes >= 1024 && i < units.length - 1) {
        bytes /= 1024;
        i++;
    }
    return bytes.toFixed(i > 0 ? 1 : 0) + " " + units[i];
}

/* 格式化时间戳为中文本地时间 */
/* 格式化时间戳为中文长日期格式，如: 2026年6月21日 20:16:01 */
/* 自动检测时间戳是秒级(10位)还是毫秒级(13位) */
function formatTime(ts) {
    if (!ts) return "-";
    try {
        var numTs = Number(ts);
        /* 判断：如果数值小于 1e12 则是秒级，否则是毫秒级 */
        var d;
        if (numTs < 1e12) {
            d = new Date(numTs * 1000);
        } else {
            d = new Date(numTs);
        }
        /* 验证日期是否合理 */
        if (isNaN(d.getTime()) || d.getFullYear() < 2000 || d.getFullYear() > 2100) return "-";
        var y = d.getFullYear();
        var M = d.getMonth() + 1;
        var day = d.getDate();
        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        return y + "年" + M + "月" + day + "日 " +
            String(h).padStart(2, '0') + ":" +
            String(m).padStart(2, '0') + ":" +
            String(s).padStart(2, '0');
    } catch (e) {
        return String(ts);
    }
}

/* API请求封装 */
async function api(path, opts) {
    opts = opts || {};
    var url = API_BASE + path;
    var headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;

    var fetchOpts = {
        method: opts.method || "GET",
        headers: headers
    };

    if (opts.body) {
        fetchOpts.body = typeof opts.body === "string" ? opts.body : JSON.stringify(opts.body);
    }

    if (opts.raw) {
        fetchOpts.body = opts.raw;
        delete headers["Content-Type"];
    }

    try {
        var resp = await fetch(url, fetchOpts);
        var text = await resp.text();
        var data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            data = text;
        }

        if (!resp.ok) {
            var errMsg = (data && data.error) ? data.error : (typeof data === 'string' ? data : "请求失败 (" + resp.status + ")");
            throw new Error(errMsg);
        }
        return data;
    } catch (e) {
        if (e.message === "Failed to fetch") {
            throw new Error("网络连接失败，请检查服务器");
        }
        throw e;
    }
}

/* 文件上传专用API（带进度回调） */
function uploadFile(path, file, onProgress) {
    return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        var url = API_BASE + "/files/upload";
        xhr.open("POST", url);
        if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);

        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable && onProgress) {
                onProgress(Math.round(e.loaded / e.total * 100));
            }
        };

        xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); }
                catch (e) { resolve(xhr.responseText); }
            } else {
                var errMsg = "上传失败";
                try {
                    var errData = JSON.parse(xhr.responseText);
                    errMsg = errData.error || errMsg;
                } catch (e) {}
                reject(new Error(errMsg));
            }
        };

        xhr.onerror = function() { reject(new Error("网络错误")); };

        var formData = new FormData();
        formData.append("path", path);
        formData.append("file", file);
        xhr.send(formData);
    });
}

/* Toast通知 */
function toast(msg, type) {
    type = type || "info";
    var container = document.getElementById("toastContainer");
    var el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function() {
        el.style.opacity = "0";
        el.style.transform = "translateX(40px)";
        el.style.transition = "all .3s";
        setTimeout(function() { el.remove(); }, 300);
    }, 3000);
}

/* 加载目录树 - 支持层级展开 */
async function loadFileTree() {
    try {
        var data = await api("/files/list?path=");
        var tree = document.getElementById("fileTree");
        if (!tree) return;

        var items = data.items || data.files || data || [];
        if (typeof window.treeExpanded === 'undefined') window.treeExpanded = {};

        var html = '<div class="tree-node ' + (fileCurrentPath === "" ? "active" : "") + '" onclick="window.treeExpanded={};loadFileList(\'\');loadFileTree();" style="padding:6px 10px;cursor:pointer;font-size:13px;border-radius:4px;' + (fileCurrentPath === "" ? "background:rgba(59,130,246,.15);color:var(--accent)" : "") + '">📂 根目录</div>';

        html += await renderTreeLevel(items, "", 0);
        tree.innerHTML = html;
    } catch (e) {
        var tree = document.getElementById("fileTree");
        if (tree) tree.innerHTML = '<div style="color:var(--text2);padding:10px;font-size:12px">加载失败</div>';
    }
}

/* 递归渲染目录树的每一层 */
async function renderTreeLevel(items, parentPath, depth) {
    var html = "";
    var sorted = items.slice().sort(function(a, b) {
        var aD = (a.is_dir || a.IsDir) ? 0 : 1;
        var bD = (b.is_dir || b.IsDir) ? 0 : 1;
        return aD - bD || (a.name || "").localeCompare(b.name || "");
    });

    for (var i = 0; i < sorted.length; i++) {
        var item = sorted[i];
        var name = item.name || item.Name || "";
        var isDir = item.is_dir || item.IsDir;
        var fullPath = parentPath ? parentPath + "/" + name : name;
        var isActive = fileCurrentPath === fullPath;
        var isExpanded = !!window.treeExpanded[fullPath];
        var indent = 6 + depth * 16;

        if (isDir) {
            var arrow = isExpanded ? "▼" : "▶";
            html += '<div class="tree-node" style="padding:3px 10px 3px ' + indent + 'px;cursor:pointer;font-size:' + Math.max(11, 13 - depth) + 'px;border-radius:4px;' + (isActive ? "background:rgba(59,130,246,.15);color:var(--accent)" : "") + '" onclick="window.treeExpanded[\'' + escHtml(fullPath) + '\']=!window.treeExpanded[\'' + escHtml(fullPath) + '\'];loadFileList(\'' + escHtml(fullPath) + '\');loadFileTree();">';
            html += '<span style="display:inline-block;width:14px;font-size:10px">' + arrow + '</span> 📁 ' + escHtml(name);
            html += '</div>';

            if (isExpanded) {
                try {
                    var subData = await api("/files/list?path=" + encodeURIComponent(fullPath));
                    var subItems = subData.items || subData.files || subData || [];
                    html += await renderTreeLevel(subItems, fullPath, depth + 1);
                } catch(e) { /* 静默处理 */ }
            }
        } else {
            var icon = getFileIcon(name);
            html += '<div class="tree-node" style="padding:2px 10px 2px ' + (indent + 14) + 'px;font-size:' + Math.max(10, 12 - depth) + 'px;color:var(--text2)" onclick="viewFile(\'' + escHtml(fullPath) + '\')">';
            html += icon + " " + escHtml(name);
            html += "</div>";
        }
    }
    return html;
}

            body.innerHTML = '<div class="empty-state"><div class="icon">📂</div><div class="text">此目录为空</div></div>';
            return;
        }

        /* 排序：目录在前，然后按名称 */
        items.sort(function(a, b) {
            var aDir = a.is_dir || a.IsDir ? 0 : 1;
            var bDir = b.is_dir || b.IsDir ? 0 : 1;
            if (aDir !== bDir) return aDir - bDir;
            var aName = a.name || a.Name || "";
            var bName = b.name || b.Name || "";
            return aName.localeCompare(bName);
        });

        var html = "";
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var name = item.name || item.Name || "";
            var isDir = item.is_dir || item.IsDir;
            var size = item.size || item.Size || 0;
            var icon = isDir ? "📁" : getFileIcon(name);

            var fullPath = fileCurrentPath ? fileCurrentPath + '/' + name : name;
                html += '<div class="file-row" id="frow-' + i + '">' +
                '<div class="file-check"><input type="checkbox" onchange="toggleFileSelect(\'' + escHtml(name) + '\', this.checked)"></div>' +
                '<div class="file-icon">' + icon + '</div>' +
                '<div class="file-name" onclick="' + (isDir ? "loadFileList('" + escHtml(fullPath) + "')" : "viewFile('" + escHtml(fullPath) + "')") + '" style="cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(name) + '</div>' +
                '<div class="file-size" style="min-width:70px">' + (isDir ? '-' : formatSize(size)) + '</div>' +

/* 文件上传处理 */
async function handleFileUpload(event) {
    var files = event.target.files;
    if (!files || files.length === 0) return;

    /* 去重：同一个文件可能出现在多个路径中，用 webkitRelativePath 去重 */
    var _seen = {};
    var _unique = [];
    for (var _fi = 0; _fi < files.length; _fi++) {
        var _k = files[_fi].webkitRelativePath || files[_fi].name;
        if (!_seen[_k]) { _seen[_k] = true; _unique.push(files[_fi]); }
    }
    files = _unique;

    var totalFiles = files.length;
    var completed = 0;
    var errors = 0;

    /* 显示右下角浮动上传进度 */
    var progressEl = document.getElementById("uploadFloatProgress");
    if (!progressEl) {
        progressEl = document.createElement("div");
        progressEl.id = "uploadFloatProgress";
        progressEl.style.cssText = "position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;min-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.4)";
        document.body.appendChild(progressEl);
    }
    progressEl.innerHTML = '<div style="font-size:13px;font-weight:600;margin-bottom:8px">📤 上传文件</div>' +
        '<div style="font-size:12px;color:var(--text2);margin-bottom:6px" id="uploadProgressText">0/' + totalFiles + '</div>' +
        '<div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:4px"><div id="uploadProgressFill" style="height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width .3s"></div></div>' +
        '<div id="uploadSingleFileText" style="font-size:11px;color:var(--text2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px"></div>' +
        '<div style="height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-bottom:2px"><div id="uploadSingleProgressFill" style="height:100%;background:#22c55e;border-radius:2px;width:0%;transition:width .15s"></div></div>' +
        '<div id="uploadSinglePct" style="font-size:10px;color:#22c55e;text-align:right;margin-bottom:4px"></div>' +
        '<div id="uploadCurrentFile" style="font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px"></div>';
    progressEl.style.display = "block";

    for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var filePath = file.name;
        if (fileCurrentPath) {
            var baseName = fileCurrentPath.split('/').pop();
            if (!file.name.startsWith(baseName + '/') && file.name !== baseName) {
                filePath = fileCurrentPath + '/' + file.name;
            }
        }
        var curFileEl = document.getElementById("uploadCurrentFile");
        if (curFileEl) curFileEl.textContent = '' + (i+1) + '/' + totalFiles + ' ' + file.name;

        try {
            await uploadFile(filePath, file, function(pct) {
                var singleFill = document.getElementById("uploadSingleProgressFill");
                if (singleFill) singleFill.style.width = pct + '%';
                var singlePct = document.getElementById("uploadSinglePct");
                if (singlePct) singlePct.textContent = pct + '%';
            })
            completed++;
        } catch (e) {
            errors++;
            console.error("上传失败:", file.name, e);
        }

        var progressEl = document.getElementById("uploadProgressText");
        var fillEl = document.getElementById("uploadProgressFill");
        if (progressEl) progressEl.textContent = completed + '/' + totalFiles;
        if (fillEl) fillEl.style.width = Math.round((completed + errors) / totalFiles * 100) + '%';
    }

    var pEl = document.getElementById("uploadFloatProgress");
    if (pEl) { setTimeout(function(){ pEl.style.display = "none"; }, 1500); }
    if (errors > 0) {
        toast("上传完成，" + errors + " 个文件失败", "warning");
    } else {
        toast("上传成功，共 " + completed + " 个文件", "success");
    }

    event.target.value = "";
    loadFileList(fileCurrentPath);
    loadFileTree();
}

/* 批量删除 - 逐个调用删除接口 */
async function batchDeleteFiles() {
    if (fileSelected.size === 0) return;
    var paths = [];
    fileSelected.forEach(function(name) {
        paths.push(fileCurrentPath ? fileCurrentPath + '/' + name : name);
    });

    showConfirm("确定删除选中的 " + paths.length + " 个文件/文件夹？", async function() {
        showLoading();
        var errors = 0;
        for (var i = 0; i < paths.length; i++) {

        updateBatchButtons();
        loadFileList(fileCurrentPath);

/* 递归加载所有目录用于移动选择 */
async function loadMoveDirs(parentPath, depth, result) {
    if (depth > 10) return;
    try {
        var data = await api("/files/list?path=" + encodeURIComponent(parentPath));
        var items = data.files || data.items || data || [];
        for (var i = 0; i < items.length; i++) {
            if (items[i].is_dir || items[i].IsDir) {
                var name = items[i].name || items[i].Name;
                var fullPath = parentPath ? parentPath + "/" + name : name;
                result.push({name: name, path: fullPath, depth: depth + 1});
                await loadMoveDirs(fullPath, depth + 1, result);
            }
        }
    } catch(e) {}
}

function doBatchMove(dest) {
    closeModal();
    var paths = [];
    fileSelected.forEach(function(name) {
        paths.push(fileCurrentPath ? fileCurrentPath + "/" + name : name);
    });
    showLoading();
    api("/files/move", { method: "POST", body: { paths: paths, dest: dest } })
        .then(function() {
            hideLoading();
            toast("批量移动成功", "success");
            fileSelected.clear();
            updateBatchButtons();
            loadFileList(fileCurrentPath);
            loadFileTree();
        })
        .catch(function(e) {
            hideLoading();
            toast("移动失败: " + e.message, "error");
        });
}

/* 下载文件 */
function downloadFile(path) {
    var url = API_BASE + "/files/download?path=" + encodeURIComponent(path);
    var a = document.createElement("a");
    a.href = url;
    a.download = path.split('/').pop();
    if (token) {
        /* 需要带Token的请求 */
        fetch(url, { headers: { "Authorization": "Bearer " + token } })
            .then(function(resp) { return resp.blob(); })
            .then(function(blob) {
                var blobUrl = URL.createObjectURL(blob);
                a.href = blobUrl;
                a.click();
                URL.revokeObjectURL(blobUrl);
            })
            .catch(function(e) { toast("下载失败: " + e.message, "error"); });
    } else {
        a.click();
    }
}

/* 查看文件 */
async function viewFile(path) {
    var ext = path.split('.').pop().toLowerCase();
    var imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp', 'ico'];
    var textExts = ['txt', 'md', 'json', 'xml', 'yaml', 'yml', 'csv', 'log', 'ini', 'cfg', 'conf', 'toml', 'env', 'js', 'ts', 'py', 'go', 'java', 'c', 'cpp', 'h', 'html', 'css', 'sh', 'bat', 'sql', 'rs', 'rb', 'php', 'vue', 'jsx', 'tsx', 'svelte'];

    if (imageExts.indexOf(ext) >= 0) {
        /* 显示图片预览 */
        var imgUrl = API_BASE + "/files/download?path=" + encodeURIComponent(path);
        var bodyHtml = '<div class="file-viewer"><img src="' + imgUrl + '" style="max-width:100%" onerror="this.src=\'\'; this.alt=\'图片加载失败\'' + (token ? '; this.parentElement.innerHTML=\'<p>需要认证加载图片</p>\'' : '') + '"></div>';
        var footer = '<button class="btn" onclick="closeModal()">关闭</button>' +
            '<button class="btn btn-primary" onclick="downloadFile(\'' + escHtml(path) + '\')">下载</button>';
        openModal("查看: " + path.split('/').pop(), bodyHtml, footer, true);
    } else if (textExts.indexOf(ext) >= 0) {
        /* 显示文本内容 + 编辑器 */
        try {
            showLoading();
            var resp = await fetch(API_BASE + "/files/download?path=" + encodeURIComponent(path), {
                headers: { "Authorization": "Bearer " + token }
            });
            var text = await resp.text();
            hideLoading();

            var bodyHtml = '<textarea id="fileEditText" style="width:100%;height:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:13px;color:var(--text);resize:vertical;outline:none">' + escHtml(text) + '</textarea>';
            var footer = '<button class="btn" onclick="closeModal()">关闭</button>' +
                '<button class="btn btn-primary" onclick="saveFileEdit(\'' + escHtml(path) + '\')">保存</button>';
            openModal("编辑: " + path.split('/').pop(), bodyHtml, footer, true);
        } catch (e) {
            hideLoading();
            toast("读取文件失败: " + e.message, "error");
        }
    } else {
        /* 其他文件直接下载 */
        downloadFile(path);
    }
}

/* 直接编辑文件 */
async function editFileDirect(path) {
    var ext = path.split('.').pop().toLowerCase();
    var textExts = ['txt', 'md', 'json', 'xml', 'yaml', 'yml', 'csv', 'log', 'ini', 'cfg', 'conf', 'toml', 'env', 'js', 'ts', 'py', 'go', 'java', 'c', 'cpp', 'h', 'html', 'css', 'sh', 'bat', 'sql', 'rs', 'rb', 'php', 'vue', 'jsx', 'tsx', 'svelte'];
    if (textExts.indexOf(ext) < 0) {
        toast("此文件类型不支持编辑，请使用查看功能", "warning");
        return;
    }
    try {
        showLoading();
        var resp = await fetch(API_BASE + "/files/download?path=" + encodeURIComponent(path), {
            headers: { "Authorization": "Bearer " + token }
        });
        var text = await resp.text();
        hideLoading();

        var bodyHtml = '<div class="form-group"><label>文件路径: <span>' + escHtml(path) + '</label></div>' +
            '<textarea id="fileEditText" style="width:100%;height:400px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:13px;color:var(--text);resize:vertical;outline:none;tab-size:4">' + escHtml(text) + '</textarea>';
        var footer = '<button class="btn" onclick="closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="saveFileEdit(\'' + escHtml(path) + '\')">💾 保存</button>';
        openModal("编辑: " + path.split('/').pop(), bodyHtml, footer, true);
    } catch (e) {
        hideLoading();
        toast("读取文件失败: " + e.message, "error");
    }
}

/* 保存编辑的文件 */
async function saveFileEdit(path) {
    var textarea = document.getElementById("fileEditText");
    if (!textarea) return;

    var content = textarea.value;
    try {
        showLoading();
        var formData = new FormData();
        formData.append("path", path);
        formData.append("file", new Blob([content], { type: "text/plain" }), path.split('/').pop());

        var resp = await fetch(API_BASE + "/files/upload", {
            method: "POST",
            headers: { "Authorization": "Bearer " + token },
            body: formData
        });

        if (!resp.ok) throw new Error("保存失败");
        hideLoading();
        toast("文件保存成功", "success");
        closeModal();
    } catch (e) {
        hideLoading();
        toast("保存失败: " + e.message, "error");
    }
}

            '<div>• <strong>保留远端:</strong> 用冲突副本覆盖服务端文件</div>' +

/* 批量解决所有冲突 */
async function batchResolveConflicts(action) {
    var actionText = { keep_server: '全部保留服务端版本', keep_remote: '全部保留远端版本', 'delete': '全部删除' };
    var text = actionText[action] || action;
    showConfirm('确定' + text + '？将处理所有冲突文件。', async function() {
        try {
            showLoading();
            var data = await api('/conflicts');
            var conflicts = data.conflicts || data || [];
            var successCount = 0;
            var failCount = 0;
            for (var i = 0; i < conflicts.length; i++) {
                var cid = conflicts[i].id || conflicts[i].ID || 0;
                if (cid === 0) continue;
                try {
                    await api('/conflicts/resolve', { method: 'POST', body: { id: cid, action: action } });
                    successCount++;
                } catch(e) {
                    failCount++;
                }
            }
            hideLoading();
            if (failCount === 0) {
                toast('全部处理完成，共 ' + successCount + ' 个', 'success');
            } else {
                toast('成功 ' + successCount + ' 个，失败 ' + failCount + ' 个', 'warning');
            }
            renderConflicts(document.getElementById('contentBody'));
        } catch (e) {
            hideLoading();
            toast('操作失败: ' + e.message, 'error');
        }
    });
}

/* 解决冲突 */
async function resolveConflict(id, action) {
    var actionText = { keep_server: "保留服务端版本", keep_remote: "保留远端版本", delete: "全部删除" };
    var text = actionText[action] || action;
    showConfirm("确定" + text + "？", async function() {
        try {
            showLoading();
            await api("/conflicts/resolve", { method: "POST", body: { id: id, action: action } });
            hideLoading();
            toast("冲突已解决", "success");
            renderConflicts(document.getElementById("contentBody"));
        } catch (e) {
            hideLoading();
            toast("操作失败: " + e.message, "error");
        }
    });
}

/* 获取指标等级颜色 */
function getMetricLevel(val, warn, crit) {
    if (val >= crit) return 'red';
    if (val >= warn) return 'yellow';
    return 'green';
}

/* 格式化字节为人类可读 */
function fmtBytes(b) {
    if (!b || b === 0) return "0 B";
    var u = ["B","KB","MB","GB","TB"];
    var i = 0;
    while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
    return b.toFixed(i > 0 ? 1 : 0) + " " + u[i];
}

/* 格式化运行时间 */
function fmtUptime(seconds) {
    if (!seconds) return "--";
    var d = Math.floor(seconds / 86400);
    var h = Math.floor((seconds % 86400) / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = Math.floor(seconds % 60);
    var parts = [];
    if (d > 0) parts.push(d + "天");
    if (h > 0) parts.push(h + "时");
    if (m > 0) parts.push(m + "分");
    parts.push(s + "秒");
    return parts.join("");
}

/* 开始SSE连接 */
function startMonitorSSE() {
    stopMonitorSSE();
    if (!token) return;

    try {
        monitorSSE = new EventSource('/api/admin/metrics/stream?token=' + encodeURIComponent(token));

        monitorSSE.onmessage = function(event) {
            try {
                var d = JSON.parse(event.data);
                handleMonitorData(d);
            } catch (e) {
                console.error("SSE数据解析错误:", e);
            }
        };

        monitorSSE.onerror = function() {
            console.warn("SSE连接失败，切换到轮询模式");
            var statusEl = document.getElementById("mdConnStatus");
            if (statusEl) { statusEl.className = "badge badge-yellow"; statusEl.textContent = "轮询中"; }
            stopMonitorSSE();
            startMonitorPolling();
        };

        monitorSSE.onopen = function() {
            var statusEl = document.getElementById("mdConnStatus");
            if (statusEl) { statusEl.className = "badge badge-green"; statusEl.textContent = "已连接"; }
        };
    } catch (e) {
        console.warn("SSE初始化失败，使用轮询模式:", e);
        startMonitorPolling();
    }
}

/* 停止SSE */
function stopMonitorSSE() {
    if (monitorSSE) {
        monitorSSE.close();
        monitorSSE = null;
    }
    if (monitorPollTimer) {
        clearInterval(monitorPollTimer);
        monitorPollTimer = null;
    }
}

/* 轮询模式回退 */
function startMonitorPolling() {
    monitorPollTimer = setInterval(async function() {
        if (currentPage !== "monitor") return;
        try {
            var data = await api("/metrics");
            handleMonitorData(data);
        } catch (e) {
            console.error("轮询获取指标失败:", e);
        }
    }, 2000);
}

/* 处理监控数据 */
function handleMonitorData(d) {
    if (!d) return;
    monitorLastData = d;

    /* 解析嵌套JSON结构 */
    var cpuVal = 0, memVal = 0, swapVal = 0, diskVal = 0;
    var cpuCores = 0, load1 = 0, load5 = 0, load15 = 0;
    var memTotal = 0, memUsed = 0, memAvail = 0;
    var swapTotal = 0, swapUsed = 0;
    var diskTotal = 0, diskUsed = 0, diskFree = 0;
    var goroutines = 0, uptime = 0, memAlloc = 0, memSys = 0, numGC = 0, lastGCPause = 0, heapObj = 0, heapInuse = 0;

    if (d.cpu) {
        cpuVal = d.cpu.usage_percent || 0;
        cpuCores = d.cpu.cores || 0;
        load1 = d.cpu.load1 || d.cpu.load1m || d.cpu.load_avg && d.cpu.load_avg[0] || 0;
        load5 = d.cpu.load5 || d.cpu.load5m || d.cpu.load_avg && d.cpu.load_avg[1] || 0;
        load15 = d.cpu.load15 || d.cpu.load15m || d.cpu.load_avg && d.cpu.load_avg[2] || 0;
    }
    if (d.memory) {
        memVal = d.memory.used_percent || 0;
        memTotal = d.memory.total || 0;
        memUsed = d.memory.used || 0;
        memAvail = d.memory.available || d.memory.free || 0;
    }
    if (d.swap) {
        swapVal = d.swap.used_percent || 0;
        swapTotal = d.swap.total || 0;
        swapUsed = d.swap.used || 0;
    }
    if (d.disk) {
        diskVal = d.disk.used_percent || 0;
        diskTotal = d.disk.total || 0;
        diskUsed = d.disk.used || 0;
        diskFree = d.disk.free || d.disk.available || 0;
    }
    goroutines = d.process && d.process.goroutines || d.goroutines || d.num_goroutine || 0;
    uptime = d.process && d.process.uptime || d.uptime_seconds || d.uptime || 0;
    memAlloc = d.process_memory || d.process && d.process.mem_alloc || d.mem_alloc || 0;
    memSys = d.process && d.process.mem_sys || d.mem_sys || 0;
    numGC = d.process && d.process.num_gc || d.num_gc || 0;
    lastGCPause = d.process && d.process.last_gc_pause || d.last_gc_pause || 0;
    heapObj = d.process && d.process.heap_objects || d.heap_objects || 0;
    heapInuse = d.process && d.process.heap_inuse || d.heap_inuse || 0;

    /* 推入数据点 */
    chartData.cpu.push(cpuVal);

/* 绘制单个图表 - 公有云风格 */
function drawChart(canvas, data, color, label) {
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var parentW = canvas.parentElement.clientWidth - 32;
    /* 限制图表最大宽度防止一直变宽 */
    var w = canvas.width = Math.min(parentW, 800);
    var h = canvas.height = 180;

    ctx.clearRect(0, 0, w, h);

    /* 绘制背景网格 */
    ctx.strokeStyle = "rgba(51,65,85,0.2)";
    ctx.lineWidth = 1;
    for (var gy = 0; gy <= 4; gy++) {
        var yy = h - (gy * h / 4);
        ctx.beginPath();
        ctx.moveTo(0, yy);
        ctx.lineTo(w, yy);
        ctx.stroke();

        /* Y轴标签 */
        ctx.fillStyle = "#94a3b8";
        ctx.font = "10px sans-serif";
        ctx.fillText((gy * 25) + "%", 2, yy - 3);
    }

    if (data.length === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("等待数据...", w / 2, h / 2);
        ctx.textAlign = "start";
        return;
    }

    /* 计算绘制参数 */
    var padding = 35;
    var drawW = w - padding;
    var stepX = data.length > 1 ? drawW / (data.length - 1) : drawW;

    /* X轴时间标签 */
    ctx.fillStyle = "#94a3b8";
    ctx.font = "10px sans-serif";
    var totalPoints = data.length;
    var labelInterval = Math.max(1, Math.floor(totalPoints / 5));
    for (var li = 0; li < totalPoints; li += labelInterval) {
        var lx = padding + li * stepX;
        var secsAgo = (totalPoints - 1 - li);
        var timeLabel = secsAgo === 0 ? "现在" : "-" + secsAgo + "s";
        ctx.fillText(timeLabel, lx - 10, h - 2);
    }

    /* 绘制渐变填充区域 */
    ctx.beginPath();
    ctx.moveTo(padding, h);
    for (var i = 0; i < data.length; i++) {
        var x = padding + i * stepX;
        var y = h - (data[i] / 100 * (h - 16));
        if (i === 0) ctx.lineTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.lineTo(padding + (data.length - 1) * stepX, h);
    ctx.closePath();
    var gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + "40");
    gradient.addColorStop(1, color + "05");
    ctx.fillStyle = gradient;
    ctx.fill();

    /* 绘制线条 */
    ctx.beginPath();
    for (var i = 0; i < data.length; i++) {
        var x = padding + i * stepX;
        var y = h - (data[i] / 100 * (h - 16));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    /* 绘制最新值点 */
    if (data.length > 0) {
        var lastX = padding + (data.length - 1) * stepX;
        var lastY = h - (data[data.length - 1] / 100 * (h - 16));
        /* 外圈发光 */
        ctx.beginPath();
        ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
        ctx.fillStyle = color + "30";
        ctx.fill();
        /* 内圈 */
        ctx.beginPath();
        ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }
}

   页面8：回收站

var trashSelected = new Set();

async function renderTrash(container) {
    trashSelected.clear();

    var headerActions = document.getElementById("headerActions");
    headerActions.innerHTML =
        '<div class="btn-group">' +
            '<button class="btn btn-success" onclick="trashRestoreAll()">全部恢复</button>' +
            '<button class="btn btn-danger" onclick="trashClear()">清空回收站</button>' +
        '</div>';

    container.innerHTML = '<div class="no-data">加载中...</div>';

    try {
        var data = await api("/trash");
        var files = data.files || data || [];

        if (files.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">🗑️</div><div class="text">回收站为空</div></div>';
            return;
        }

        var html = '<div class="trash-header">' +
            '<button class="btn btn-sm btn-success" onclick="trashBatchRestore()" id="trashBatchRestoreBtn" style="display:none">📦 批量恢复</button>' +
            '<button class="btn btn-sm btn-danger" onclick="trashBatchDelete()" id="trashBatchDeleteBtn" style="display:none">🗑️ 批量删除</button>' +
            '<span style="font-size:13px;color:var(--text2)" id="trashSelectInfo">共 ' + files.length + ' 个文件</span>' +
        '</div>';

        html += '<div class="table-wrap"><table><thead><tr>' +
            '<th style="width:40px"><input type="checkbox" onchange="toggleAllTrash(this.checked)"></th>' +
            '<th>文件名</th><th>大小</th><th>原始路径</th><th>操作</th>' +
            '</tr></thead><tbody>';

        for (var i = 0; i < files.length; i++) {
            var f = files[i];
            var name = f.name || f.Name || "";
            var path = f.path || f.Path || "";
            var size = f.size || f.Size || 0;

            html += '<tr id="trash-row-' + i + '">' +
                '<td><input type="checkbox" onchange="toggleTrashSelect(\'' + escHtml(path) + '\', this.checked)"></td>' +
                '<td style="font-size:13px">📄 ' + escHtml(name) + '</td>' +
                '<td style="font-size:13px;color:var(--text2)">' + formatSize(size) + '</td>' +
                '<td style="font-size:12px;color:var(--text2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(path) + '</td>' +
                '<td>' +
                    '<div class="btn-group">' +
                        '<button class="btn btn-sm" onclick="trashView(\'' + escHtml(path) + '\')">查看</button>' +
                        '<button class="btn btn-sm btn-success" onclick="trashRestore(\'' + escHtml(path) + '\')">恢复</button>' +
                        '<button class="btn btn-sm btn-danger" onclick="trashDelete(\'' + escHtml(path) + '\')">彻底删除</button>' +
                    '</div>' +
                '</td>' +
                '</tr>';
        }

        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="no-data">加载回收站失败: ' + escHtml(e.message) + '</div>';
    }
}

/* 全选/取消全选 */
function toggleAllTrash(checked) {
    var checkboxes = document.querySelectorAll('#contentBody tbody input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
        cb.checked = checked;
        var event = new Event('change');
        cb.dispatchEvent(event);
    });
}

/* 单个选择 */
function toggleTrashSelect(path, checked) {
    if (checked) trashSelected.add(path);
    else trashSelected.delete(path);

    var restoreBtn = document.getElementById("trashBatchRestoreBtn");
    var deleteBtn = document.getElementById("trashBatchDeleteBtn");
    var infoEl = document.getElementById("trashSelectInfo");

    if (restoreBtn) restoreBtn.style.display = trashSelected.size > 0 ? "inline-flex" : "none";
    if (deleteBtn) deleteBtn.style.display = trashSelected.size > 0 ? "inline-flex" : "none";
    if (infoEl) infoEl.textContent = trashSelected.size > 0 ? "已选择 " + trashSelected.size + " 个文件" : "";
}

/* 查看回收站文件 */
async function trashView(path) {

/* 批量恢复 */
function trashBatchRestore() {
    if (trashSelected.size === 0) return;
    showConfirm("确定恢复选中的 " + trashSelected.size + " 个文件？", async function() {
        showLoading();
        var errors = 0;
        for (var path of trashSelected) {
            try {
                await api("/trash/restore", { method: "POST", body: { path: path } });
            } catch (e) {
                errors++;
            }
        }
        hideLoading();
        if (errors > 0) toast(errors + " 个文件恢复失败", "warning");
        else toast("批量恢复成功", "success");
        trashSelected.clear();
        renderTrash(document.getElementById("contentBody"));
    });
}

/* ========================================================
   页面9：日志
   ======================================================== */

async function renderLogs(container) {
    var headerActions = document.getElementById("headerActions");
    headerActions.innerHTML = '<button class="btn btn-danger" onclick="clearAllLogs()">🗑️ 清空日志</button>';

    container.innerHTML = '<div class="no-data">加载中...</div>';

    try {
        var data = await api("/logs");
        var logs = data.logs || data || [];

        if (logs.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="text">暂无日志</div></div>';
            return;
        }

        var html = '<div class="table-wrap"><table><thead><tr>' +
            '<th style="width:40px">#</th><th>时间</th><th>级别</th><th>内容</th><th style="width:60px">操作</th>' +
            '</tr></thead><tbody>';

        for (var i = 0; i < logs.length; i++) {
            var log = logs[i];
            var level = (log.level || log.Level || "info").toLowerCase();
            var levelBadge = "";
            if (level === "error") levelBadge = '<span class="badge badge-red">ERROR</span>';
            else if (level === "warn" || level === "warning") levelBadge = '<span class="badge badge-yellow">WARN</span>';
            else if (level === "debug") levelBadge = '<span class="badge badge-blue">DEBUG</span>';
            else levelBadge = '<span class="badge badge-green">INFO</span>';

            var msg = log.message || log.msg || log.text || log.log || "";
            var ts = log.timestamp || log.time || log.ts || log.created_at || 0;
            var logId = log.id || i;

            html += '<tr>' +
                '<td class="log-row-num">' + (i + 1) + '</td>' +
                '<td style="font-size:12px;white-space:nowrap;color:var(--text2)">' + formatTime(ts) + '</td>' +
                '<td>' + levelBadge + '</td>' +
                '<td style="font-size:13px;max-width:500px;word-break:break-all">' + escHtml(msg) + '</td>' +
                '<td><button class="btn btn-sm btn-danger" onclick="deleteLog(' + logId + ')">删除</button></td>' +
                '</tr>';
        }

        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="no-data">加载日志失败: ' + escHtml(e.message) + '</div>';
    }
}

/* 加载当前设置 */
async function loadCurrentSettings() {
    try {
        var data = await api("/settings");
        if (data.listen_addr || data.ListenAddr) {
            var addrEl = document.getElementById("settingsListenAddr");
            if (addrEl) addrEl.value = data.listen_addr || data.ListenAddr;
        }
        if (data.scan_interval || data.ScanInterval) {
            var scanEl = document.getElementById("settingsScanInterval");
            if (scanEl) scanEl.value = data.scan_interval || data.ScanInterval;
        }
        if (data.trash_retention_days || data.TrashRetentionDays) {
            var trashEl = document.getElementById("settingsTrashDays");
            if (trashEl) trashEl.value = data.trash_retention_days || data.TrashRetentionDays;
        }
    } catch (e) {
        console.error("加载设置失败:", e);
    }
}

/* 保存用户名 */
async function saveUsername() {
    var newUser = document.getElementById("settingsNewUser").value.trim();
    var pass = document.getElementById("settingsUserPass").value;

    if (!newUser) { toast("请输入新用户名", "warning"); return; }
    if (!pass) { toast("请输入当前密码", "warning"); return; }

    try {
        showLoading();
        await api("/change-username", { method: "POST", body: { new_username: newUser, password: pass } });
        hideLoading();
        toast("用户名修改成功", "success");
    } catch (e) {
        hideLoading();
        toast("修改失败: " + e.message, "error");
    }
}

/* 保存密码 */
async function savePassword() {
    var oldPass = document.getElementById("settingsOldPass").value;
    var newPass = document.getElementById("settingsNewPass").value;

    if (!oldPass) { toast("请输入当前密码", "warning"); return; }
    if (!newPass) { toast("请输入新密码", "warning"); return; }
    if (newPass.length < 4) { toast("新密码至少4个字符", "warning"); return; }

    try {
        showLoading();
        await api("/change-password", { method: "POST", body: { old_password: oldPass, new_password: newPass } });
        hideLoading();
        toast("密码修改成功", "success");
        document.getElementById("settingsOldPass").value = "";
        document.getElementById("settingsNewPass").value = "";
    } catch (e) {
        hideLoading();
        toast("修改失败: " + e.message, "error");
    }
}

                showMainApp();

/* 保存头像 */
async function saveAvatar() {
    var fileEl = document.getElementById("settingsAvatar");
    if (!fileEl || !fileEl.files || fileEl.files.length === 0) {
        toast("请先选择头像文件", "warning");
        return;
    }
    var form = new FormData();
    form.append("avatar", fileEl.files[0]);
    try {
        showLoading();
        var resp = await fetch("/api/admin/avatar", { method: "POST", headers: { "Authorization": "Bearer " + token }, body: form });
        if (!resp.ok) throw new Error(await resp.text());
        hideLoading();
        toast("头像已更新", "success");
    } catch (e) {
        hideLoading();
        toast("保存头像失败: " + e.message, "error");
    }
}
